  if (savedUserStr) currentUser = JSON.parse(savedUserStr);
  localStorage.removeItem("ai_custom_skills");
} catch (e) {}

function loadUserSavedFromLocalOrCloud() {
  saved.clear();
  if (!currentUser || !currentUser.email) return;
  const emailKey = currentUser.email.trim().toLowerCase();
  let titles = null;
  if (cloudUserFurnaces && cloudUserFurnaces[emailKey] && Array.isArray(cloudUserFurnaces[emailKey].savedTitles)) {
    titles = cloudUserFurnaces[emailKey].savedTitles;
    if (cloudUserFurnaces[emailKey].name && !currentUser.name) currentUser.name = cloudUserFurnaces[emailKey].name;
  } else {
    try {
      const localTitles = localStorage.getItem("ai_furnace_" + emailKey);
      if (localTitles) titles = JSON.parse(localTitles);
    } catch (e) {}
  }
  if (Array.isArray(titles)) {
    const tSet = new Set(titles);
    skills.forEach(s => { if (tSet.has(s.title)) saved.add(s.id); });
  }
}

function updateAuthUI() {
  const btn = $("userAuthBtn");
  if (!btn) return;
  if (currentUser && currentUser.email) {
    const initial = (currentUser.name || currentUser.email)[0].toUpperCase();
    btn.className = "btn-google logged";
    btn.innerHTML = `<span class="g-avatar">${initial}</span><span>${currentUser.name || currentUser.email.split("@")[0]}</span><small style="opacity:.7">切换</small>`;
  } else {
    btn.className = "btn-google";
    btn.innerHTML = `🔑 Google 账号登录`;
  }
}

async function sendToCloud(payload) {
  const fullPayload = {
    ...payload,
    userEmail: currentUser ? currentUser.email : "",
    userName: currentUser ? currentUser.name : ""
  };
  const jsonStr = JSON.stringify(fullPayload);
  try {
    if (jsonStr.length < 1800) {
      const res = await fetch(GOOGLE_SHEET_API + "?payload=" + encodeURIComponent(jsonStr));
      const data = await res.json();
      if (data && data.ok) return data;
    }
    const res = await fetch(GOOGLE_SHEET_API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: jsonStr
    });
    return await res.json();
  } catch (err) {
    fetch(GOOGLE_SHEET_API, { method: "POST", mode: "no-cors", body: jsonStr }).catch(() => {});
    return null;
  }
}

function persistState(syncFurnaceToCloud = false) {
  const savedTitles = skills.filter(s => saved.has(s.id)).map(s => s.title);
  try {
    if (currentUser && currentUser.email) {
      const emailKey = currentUser.email.trim().toLowerCase();
      localStorage.setItem("ai_current_google_user", JSON.stringify(currentUser));
      sessionStorage.setItem("ai_current_google_user", JSON.stringify(currentUser));
      localStorage.setItem("ai_furnace_" + emailKey, JSON.stringify(savedTitles));
      cloudUserFurnaces[emailKey] = { name: currentUser.name, savedTitles };
    }
    localStorage.setItem("ai_help_requests", JSON.stringify(helpRequests));
  } catch (e) {}
  if (syncFurnaceToCloud && currentUser && currentUser.email) {
    sendToCloud({ action: "syncSaved", savedTitles });
  }
}

let pendingAuthAction = null;
let isSwitchingAccount = false;

function performLogin(emailRaw, nameRaw) {
  const email = String(emailRaw || "").trim().toLowerCase();
  if (!email || !email.includes("@")) {
    toast("⚠️ 请输入有效的 Google 邮箱地址（例如 xxx@gmail.com）！");
    return false;
  }
  const name = String(nameRaw || "").trim() || email.split("@")[0];
  currentUser = { email, name };
  isSwitchingAccount = false;
  loadUserSavedFromLocalOrCloud();
  persistState(true);
  updateAuthUI();
  initCategoryList();
  render();
  toast(`🎉 欢迎回来，${name} (${email})！已加载您的专属技能炉！`);
  if (typeof pendingAuthAction === "function") {
    const fn = pendingAuthAction;
    pendingAuthAction = null;
    setTimeout(() => fn(), 120);
  }
  return true;
}

function performLogout() {
  currentUser = null;
  isSwitchingAccount = false;
  saved.clear();
  try {
    localStorage.removeItem("ai_current_google_user");
    sessionStorage.removeItem("ai_current_google_user");
  } catch (e) {}
  updateAuthUI();
  initCategoryList();
  render();
  toast("👋 已退出当前 Google 账号，技能炉已重置为空");
}

function toast(msg) {

  t.style.display = "block";

  window.toastTimer = setTimeout(() => t.style.display = "none", 2400);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("✅ 已复制到剪贴板！");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("✅ 已复制到剪贴板！");
  }
}

function normalizeDriveUrl(rawUrl) {
  const url = String(rawUrl || "").trim();
  if (!url) return "";
  const matchD = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (matchD && matchD[1]) return `https://lh3.googleusercontent.com/d/${matchD[1]}=w1000`;
  const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (matchId && matchId[1]) return `https://lh3.googleusercontent.com/d/${matchId[1]}=w1000`;
  return url;
}

      if (!title || !prompt) return toast("⚠️ 请填写技能标题和核心提示词！");
      const cat = $("pubCat").value;
      const rawImg = $("pubImg").value.trim();
      const finalImg = normalizeDriveUrl(rawImg) || "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=900&q=80";
      const newSkill = {
        id: Date.now(),
        title,
        category: cat,
        desc: $("pubDesc").value.trim() || "社区共创精选生图技能包",
        workflow: $("pubWorkflow").value.trim() || "直接复制 Prompt 并按需替换主体词与比例。",
        author: `${currentUser.name} · 社区共创`,
        feedback: "社区新发布技能，已验证可用。",
        tags: [cat, "社区共创"],
        model: $("pubModel").value.trim() || "Midjourney / Flux",
        models: ["Midjourney", "Flux"],
        difficulty: "入门",
        likes: 1,
        pop: 99,
        img: finalImg,
        prompt
      };
      skills.unshift(newSkill);
      saved.add(newSkill.id);
      const savedTitles = skills.filter(s => saved.has(s.id)).map(s => s.title);
      persistState(false);
      $("modalBackdrop").classList.remove("open");
      view = "all";
      initCategoryList();
      render();
      toast("🎉 技能发布成功！已进入公共广场并收入您个人的技能炉！");
      sendToCloud({ action: "addSkill", ...newSkill, savedTitles });
    };
  });
}

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    e.preventDefault();
    view = nav.dataset.nav;
    if (view === "saved" && (!currentUser || !currentUser.email)) isSwitchingAccount = true;
    render();
    return;
  }
  const vBtn = e.target.closest("[data-view]");
  if (vBtn) {
    view = vBtn.dataset.view;
    if (view === "saved" && (!currentUser || !currentUser.email)) isSwitchingAccount = true;
    render();
    return;
  }
  const catBtn = e.target.closest("[data-category]");
  if (catBtn) {
    category = category === catBtn.dataset.category ? "" : catBtn.dataset.category;
    $("categoryFilter").value = category;
    render();
    return;
  }
  const saveBtn = e.target.closest("[data-save]");
  if (saveBtn) {
    const id = Number(saveBtn.dataset.save);
    requireAuth(() => {
      saved.has(id) ? saved.delete(id) : saved.add(id);
      persistState(true);
      render();
      toast(saved.has(id) ? "🔥 已收入您的个人技能炉（云端已保存）！" : "已从您的技能炉移出");
    });
    return;
  }
  const detailBtn = e.target.closest("[data-detail]");
  if (detailBtn) { openDetail(Number(detailBtn.dataset.detail)); return; }
  const assistBtn = e.target.closest("[data-assist]");
  if (assistBtn) { openAssistModal(Number(assistBtn.dataset.assist)); return; }
  const copyReplyBtn = e.target.closest("[data-copy-reply]");
  if (copyReplyBtn) {
    const [hId, rIdx] = copyReplyBtn.dataset.copyReply.split("-");
    const h = helpRequests.find(x => String(x.id) === String(hId));
    if (h && h.replies && h.replies[rIdx]) copyText(h.replies[rIdx].prompt || h.replies[rIdx].advice);
    return;
  }
  const tagBtn = e.target.closest("[data-tag]");
  if (tagBtn) { $("searchInput").value = tagBtn.dataset.tag; render(); return; }
  if (e.target.id === "modalBackdrop") $("modalBackdrop").classList.remove("open");
});

const defaultSkillMeta = {};
skills.forEach(s => { defaultSkillMeta[s.title.trim()] = { ...s }; });

async function syncFromGoogleSheet() {
  try {
    const res = await fetch(GOOGLE_SHEET_API);
    const json = await res.json();
    if (json && json.ok && Array.isArray(json.data)) {
      const rebuiltSkills = [];
      const seen = new Set();
      json.data.forEach((item, idx) => {
        const title = (item.title || "").trim();
        if (!title || seen.has(title)) return;
        seen.add(title);
        const base = defaultSkillMeta[title] || {};
        const modelsArr = (item.model || base.model || "Midjourney").split(/[\/,，]+/).map(s => s.trim()).filter(Boolean);
        const normalizedImg = normalizeDriveUrl(item.img) || base.img || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=85";
        rebuiltSkills.push({
          id: base.id || item.id || (1000 + idx),
          title,
          category: item.category || base.category || "口播类",
          desc: item.desc || base.desc || "云端社区共创精选生图技能包",
          workflow: item.workflow || base.workflow || "1. 复制下方核心提示词 → 2. 粘贴至生图工具 → 3. 按需微调主体与比例",
          author: item.author || base.author || (item.status === "未更新" ? "表格待同步区 · 预览" : "云端表格同步 · 已验证"),
          feedback: base.feedback || "已通过云端表格核验同步，出图稳定。",
          tags: Array.isArray(item.tags) && item.tags.length ? item.tags : (base.tags || [item.category || "精选"]),
          model: item.model || base.model || "Midjourney / Flux",
          models: modelsArr,
          difficulty: item.difficulty || base.difficulty || "入门",
          likes: base.likes || (880 + idx * 19),
          pop: base.pop || (100 - idx),
          img: normalizedImg,
          prompt: item.prompt || base.prompt || "",
          ownerEmail: item.ownerEmail || ""
        });
      });
      // 完全以云端表格当前剩余的技能为准（后台已删除的技能在前端立即删除）
      skills.length = 0;
      rebuiltSkills.forEach(s => skills.push(s));
      try { localStorage.removeItem("ai_custom_skills"); } catch (e) {}
    }
    if (json && json.userFurnaces && typeof json.userFurnaces === "object") {
      cloudUserFurnaces = json.userFurnaces;
    }
    loadUserSavedFromLocalOrCloud();
    if (json && Array.isArray(json.helps) && json.helps.length > 0) {
      helpRequests = json.helps.map(item => ({
        ...item,
        refImg: normalizeDriveUrl(item.refImg) || "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
        replies: Array.isArray(item.replies) ? item.replies : []
      }));
    }
    if ($("cloudStatus")) {
      $("cloudStatus").innerHTML = json && json.version === "v3"
        ? "🟢 云端多用户身份隔离已激活（个人技能炉独立保存）"
        : "🟠 提示：请在表格 Apps Script 更新 v3 代码并点击「部署 → 管理部署 → 编辑 → 新版本」";
    }
    updateAuthUI();
    persistState(false);
    initCategoryList();
    render();
  } catch (err) {
    if ($("cloudStatus")) $("cloudStatus").textContent = "⚪ 离线模式（使用内置数据）";
    console.warn("Using embedded community data:", err);
  }
}

loadUserSavedFromLocalOrCloud();
updateAuthUI();
initCategoryList();
render();
syncFromGoogleSheet();
</script>
